name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            homebridge: homebridge
          - os: ubuntu-latest
            node: 24
            homebridge: homebridge-v2
          - os: windows-latest
            node: 22
            homebridge: homebridge
          - os: windows-latest
            node: 24
            homebridge: homebridge-v2
    runs-on: ${{ matrix.os }}
    env:
      SMARTGRADE_TEST_HB: ${{ matrix.homebridge }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm pack
      - run: node test/package.check.mjs homebridge-smartgrade-secure-0.1.0-alpha.2.tgz
      - run: git diff --check
