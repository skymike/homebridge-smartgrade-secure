name: Publish npm release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: npm install --global npm@11.19.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate version tag
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!==`v${p.version}`) throw Error("Tag must match package version");'
      - run: pnpm test
      - name: Test Homebridge 2
        run: node --test test/*.test.mjs
        env:
          SMARTGRADE_TEST_HB: homebridge-v2
      - name: Build and inspect package
        run: |
          pnpm pack
          VERSION=$(node -p "require('./package.json').version")
          node test/package.check.mjs "homebridge-smartgrade-secure-${VERSION}.tgz"
      - name: Publish through npm trusted publishing
        # The first version is published manually to create the npm package.
        if: github.ref_name != 'v0.1.0'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=next; fi
          npm publish --ignore-scripts --access public --provenance --tag "$TAG"
